name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - uses: ./.github/actions/find-jar
        id: jar

      - name: Create release
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.jar.outputs.path }}" --repo "$REPO" --clobber
          else
            gh release create "$tag" "${{ steps.jar.outputs.path }}" \
              --repo "$REPO" --title "JadeBridge ${tag#v}" --generate-notes
          fi
